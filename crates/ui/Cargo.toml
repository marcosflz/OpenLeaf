[package]
name = "lsx-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
lsx-core.workspace = true
lsx-latex.workspace = true
lsx-pdf.workspace = true
lsx-chat.workspace = true
lsx-editor.workspace = true
gpui-kit.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# M1-A2/A4: canal de estado paneles→shell y resultado del modal de permiso.
async-channel.workspace = true
# M1-A6: i18n con rust-i18n (misma versión que usa gpui-component 0.7.3, de
# modo que ambos crates comparten backend y `set_locale` es global).
rust-i18n = "4.2"
# M1-C (stream C, `panels/pdf.rs`): `image::Frame` para subir bitmaps a
# `RenderImage` y `camino` para las rutas UTF-8 de SyncTeX.
camino.workspace = true
image = { version = "0.25", default-features = false }
# M1-F4 (stream F, `new_project.rs`): selector nativo de carpeta destino del
# wizard «Nuevo proyecto». Se usa en modo async para no bloquear el hilo UI.
rfd.workspace = true

[dev-dependencies]
# Tests de UI con `TestAppContext` (`#[gpui_kit::test]`): clics y teclado
# reales sobre los paneles. Requiere la feature `test-support` del kit
# (mismo patrón que `crates/editor`).
gpui-kit = { workspace = true, features = ["test-support"] }
